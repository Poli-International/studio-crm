<svg width="300" height="400" viewBox="0 0 300 400" xmlns="http://www.w3.org/2000/svg">
  <!-- White background -->
  <rect width="300" height="400" fill="white"/>

  <!-- Playful oyster representation -->

  <!-- Gradients -->
  <defs>
    <radialGradient id="pearlGradient">
      <stop offset="0%" style="stop-color:#FFFFFF;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#F8F8FF;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#E6E6FA;stop-opacity:1" />
    </radialGradient>
    <linearGradient id="shellGradient" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#F5E6D3;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#E8D4C3;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#D9C4B0;stop-opacity:1" />
    </linearGradient>
  </defs>

  <!-- Bottom shell half -->
  <ellipse cx="150" cy="220" rx="80" ry="60" fill="url(#shellGradient)" stroke="#B76E79" stroke-width="3"/>

  <!-- Shell ridges (bottom) -->
  <path d="M 150 160 Q 120 180 100 210"
        fill="none" stroke="#C9B8A8" stroke-width="2" opacity="0.6"/>
  <path d="M 150 160 Q 130 185 115 215"
        fill="none" stroke="#C9B8A8" stroke-width="2" opacity="0.6"/>
  <path d="M 150 160 Q 145 190 140 220"
        fill="none" stroke="#C9B8A8" stroke-width="2" opacity="0.6"/>
  <path d="M 150 160 Q 155 190 160 220"
        fill="none" stroke="#C9B8A8" stroke-width="2" opacity="0.6"/>
  <path d="M 150 160 Q 170 185 185 215"
        fill="none" stroke="#C9B8A8" stroke-width="2" opacity="0.6"/>
  <path d="M 150 160 Q 180 180 200 210"
        fill="none" stroke="#C9B8A8" stroke-width="2" opacity="0.6"/>

  <!-- Top shell half (open) -->
  <path d="M 70 160 Q 150 120 230 160 L 220 170 Q 150 140 80 170 Z"
        fill="url(#shellGradient)" stroke="#B76E79" stroke-width="3"/>

  <!-- Shell ridges (top) -->
  <path d="M 120 155 Q 150 135 180 155"
        fill="none" stroke="#C9B8A8" stroke-width="2" opacity="0.6"/>
  <path d="M 110 165 Q 150 145 190 165"
        fill="none" stroke="#C9B8A8" stroke-width="2" opacity="0.6"/>

  <!-- Inner soft tissue (pink/rose gold) -->
  <ellipse cx="150" cy="195" rx="60" ry="45" fill="#FFE4E1" stroke="#FFB6C1" stroke-width="2" opacity="0.7"/>

  <!-- Pearl (center) -->
  <circle cx="150" cy="195" r="25" fill="url(#pearlGradient)" stroke="#E6E6FA" stroke-width="2"/>
  <circle cx="145" cy="190" r="8" fill="white" opacity="0.6"/>

  <!-- Piercing location markers -->

  <!-- VCH (Vertical Clitoral Hood) - top of pearl -->
  <circle cx="150" cy="175" r="5" fill="#B76E79"/>
  <line x1="150" y1="170" x2="150" y2="200" stroke="#B76E79" stroke-width="2" stroke-dasharray="3,3" opacity="0.4"/>
  <text x="165" y="170" font-family="Arial, sans-serif" font-size="9" fill="#B76E79">VCH</text>

  <!-- HCH (Horizontal) -->
  <line x1="130" y1="180" x2="170" y2="180" stroke="#0EA5E9" stroke-width="2" stroke-dasharray="3,3" opacity="0.4"/>
  <circle cx="130" cy="180" r="4" fill="#0EA5E9"/>
  <circle cx="170" cy="180" r="4" fill="#0EA5E9"/>
  <text x="105" y="183" font-family="Arial, sans-serif" font-size="8" fill="#0EA5E9">HCH</text>

  <!-- Inner labia positions -->
  <circle cx="125" cy="210" r="4" fill="#6B7280" opacity="0.6"/>
  <circle cx="175" cy="210" r="4" fill="#6B7280" opacity="0.6"/>
  <text x="100" y="213" font-family="Arial, sans-serif" font-size="8" fill="#6B7280">Inner</text>

  <!-- Outer labia positions -->
  <circle cx="100" cy="220" r="4" fill="#6B7280" opacity="0.5"/>
  <circle cx="200" cy="220" r="4" fill="#6B7280" opacity="0.5"/>
  <text x="75" y="223" font-family="Arial, sans-serif" font-size="8" fill="#6B7280">Outer</text>

  <!-- Triangle (deeper) -->
  <circle cx="150" cy="215" r="3" fill="#0EA5E9" opacity="0.5"/>
  <text x="160" y="218" font-family="Arial, sans-serif" font-size="7" fill="#0EA5E9">Triangle</text>

  <!-- Jewelry example -->
  <g transform="translate(230, 100)">
    <text y="-5" font-family="Arial, sans-serif" font-size="9" fill="#6B7280">Example</text>
    <text y="5" font-family="Arial, sans-serif" font-size="9" fill="#6B7280">Jewelry:</text>
    <!-- Curved barbell -->
    <path d="M 5 20 Q 10 30 5 40"
          fill="none" stroke="#B76E79" stroke-width="2"/>
    <circle cx="5" cy="20" r="4" fill="#0EA5E9"/>
    <circle cx="5" cy="40" r="3" fill="#6B7280"/>
  </g>

  <!-- Labels -->
  <text x="150" y="25" font-family="Arial, sans-serif" font-size="18" font-weight="bold" fill="#1F2937" text-anchor="middle">FEMALE GENITAL</text>
  <text x="150" y="45" font-family="Arial, sans-serif" font-size="11" fill="#6B7280" text-anchor="middle">Piercing Locations</text>
  <text x="150" y="60" font-family="Arial, sans-serif" font-size="9" fill="#9CA3AF" text-anchor="middle">(Playful representation)</text>

  <!-- Common piercings list -->
  <g transform="translate(30, 250)">
    <text y="0" font-family="Arial, sans-serif" font-size="10" font-weight="bold" fill="#B76E79">Common Types:</text>
    <text y="15" font-family="Arial, sans-serif" font-size="9" fill="#6B7280">• VCH (Vertical Hood)</text>
    <text y="28" font-family="Arial, sans-serif" font-size="9" fill="#6B7280">• HCH (Horizontal)</text>
    <text y="41" font-family="Arial, sans-serif" font-size="9" fill="#6B7280">• Inner Labia</text>
    <text y="54" font-family="Arial, sans-serif" font-size="9" fill="#6B7280">• Outer Labia</text>
    <text y="67" font-family="Arial, sans-serif" font-size="9" fill="#6B7280">• Triangle</text>
    <text y="80" font-family="Arial, sans-serif" font-size="9" fill="#6B7280">• Christina</text>
    <text y="93" font-family="Arial, sans-serif" font-size="9" fill="#6B7280">• Fourchette</text>
  </g>

  <!-- Fun fact box -->
  <g transform="translate(165, 260)">
    <rect width="110" height="70" rx="6" fill="#FFF9E6" stroke="#F59E0B" stroke-width="1.5"/>
    <text x="55" y="15" font-family="Arial, sans-serif" font-size="9" font-weight="bold" fill="#D97706" text-anchor="middle">💎 Pearl Wisdom</text>
    <text x="55" y="30" font-family="Arial, sans-serif" font-size="7.5" fill="#92400E" text-anchor="middle">Like oysters create</text>
    <text x="55" y="40" font-family="Arial, sans-serif" font-size="7.5" fill="#92400E" text-anchor="middle">pearls, VCH is most</text>
    <text x="55" y="50" font-family="Arial, sans-serif" font-size="7.5" fill="#92400E" text-anchor="middle">popular and heals</text>
    <text x="55" y="60" font-family="Arial, sans-serif" font-size="7.5" fill="#92400E" text-anchor="middle">quickly: 4-6 weeks!</text>
  </g>

  <!-- Info box -->
  <rect x="20" y="360" width="260" height="35" rx="8" fill="#F3F4F6" stroke="#6B7280" stroke-width="1"/>
  <text x="150" y="378" font-family="Arial, sans-serif" font-size="10" font-weight="bold" fill="#1F2937" text-anchor="middle">Standard: 14g-12g Curved Barbells/Rings</text>
  <text x="150" y="390" font-family="Arial, sans-serif" font-size="8" fill="#F59E0B" text-anchor="middle">⚠ Anatomy-dependent - professional assessment essential</text>
</svg>
