<svg width="300" height="400" viewBox="0 0 300 400" xmlns="http://www.w3.org/2000/svg">
  <!-- White background -->
  <rect width="300" height="400" fill="white"/>

  <!-- Ear outline (rose gold) -->
  <path d="M 150 50 Q 180 50 200 80 Q 215 110 210 150 Q 205 190 190 230 Q 175 270 160 300 Q 150 320 145 300 Q 130 270 120 230 Q 110 190 115 150 Q 120 110 135 80 Q 145 50 150 50 Z"
        fill="none" stroke="#B76E79" stroke-width="4"/>

  <!-- Outer ear helix (gem blue) -->
  <path d="M 150 60 Q 175 60 190 90 Q 200 120 195 160 Q 190 200 175 240 Q 165 270 155 290"
        fill="none" stroke="#0EA5E9" stroke-width="3" stroke-linecap="round"/>

  <!-- Inner ear structure (gray) -->
  <ellipse cx="155" cy="180" rx="35" ry="55" fill="none" stroke="#6B7280" stroke-width="3"/>

  <!-- Conch area -->
  <ellipse cx="155" cy="185" rx="20" ry="30" fill="#F3F4F6" stroke="#6B7280" stroke-width="2"/>

  <!-- Tragus (small flap) -->
  <ellipse cx="135" cy="200" rx="12" ry="18" fill="#B76E79" opacity="0.3"/>
  <ellipse cx="135" cy="200" rx="12" ry="18" fill="none" stroke="#B76E79" stroke-width="2"/>

  <!-- Anti-tragus -->
  <ellipse cx="145" cy="260" rx="10" ry="15" fill="#0EA5E9" opacity="0.2"/>
  <ellipse cx="145" cy="260" rx="10" ry="15" fill="none" stroke="#0EA5E9" stroke-width="2"/>

  <!-- Daith curve -->
  <path d="M 140 155 Q 155 145 170 155"
        fill="none" stroke="#B76E79" stroke-width="2.5" stroke-linecap="round"/>

  <!-- Rook area -->
  <path d="M 165 110 Q 175 115 180 125"
        fill="none" stroke="#6B7280" stroke-width="2.5" stroke-linecap="round"/>

  <!-- Industrial line (top to middle) -->
  <line x1="160" y1="75" x2="175" y2="170" stroke="#0EA5E9" stroke-width="1.5" stroke-dasharray="5,5" opacity="0.5"/>

  <!-- Lobe (bottom) -->
  <ellipse cx="150" cy="310" rx="25" ry="30" fill="#B76E79" opacity="0.15"/>
  <ellipse cx="150" cy="310" rx="25" ry="30" fill="none" stroke="#B76E79" stroke-width="3"/>

  <!-- Piercing location markers -->
  <circle cx="150" cy="310" r="4" fill="#B76E79"/>  <!-- Lobe -->
  <circle cx="170" cy="95" r="3" fill="#0EA5E9"/>   <!-- Helix -->
  <circle cx="135" cy="200" r="3" fill="#B76E79"/>  <!-- Tragus -->
  <circle cx="155" cy="150" r="3" fill="#6B7280"/>  <!-- Daith -->
  <circle cx="175" cy="120" r="3" fill="#6B7280"/>  <!-- Rook -->
  <circle cx="155" cy="185" r="3" fill="#0EA5E9"/>  <!-- Conch -->

  <!-- Labels -->
  <text x="150" y="25" font-family="Arial, sans-serif" font-size="18" font-weight="bold" fill="#1F2937" text-anchor="middle">EAR ANATOMY</text>
  <text x="220" y="100" font-family="Arial, sans-serif" font-size="11" fill="#6B7280">Helix</text>
  <text x="205" y="125" font-family="Arial, sans-serif" font-size="11" fill="#6B7280">Rook</text>
  <text x="190" y="155" font-family="Arial, sans-serif" font-size="11" fill="#6B7280">Daith</text>
  <text x="195" y="190" font-family="Arial, sans-serif" font-size="11" fill="#0EA5E9">Conch</text>
  <text x="100" y="205" font-family="Arial, sans-serif" font-size="11" fill="#B76E79">Tragus</text>
  <text x="150" y="350" font-family="Arial, sans-serif" font-size="11" fill="#B76E79" text-anchor="middle">Lobe</text>
</svg>
