<svg width="300" height="400" viewBox="0 0 300 400" xmlns="http://www.w3.org/2000/svg">
  <!-- White background -->
  <rect width="300" height="400" fill="white"/>

  <!-- Nose bridge (gray) -->
  <path d="M 130 80 L 135 120 L 138 160 L 140 200"
        fill="none" stroke="#6B7280" stroke-width="4" stroke-linecap="round"/>
  <path d="M 170 80 L 165 120 L 162 160 L 160 200"
        fill="none" stroke="#6B7280" stroke-width="4" stroke-linecap="round"/>

  <!-- Nose tip (rose gold) -->
  <ellipse cx="150" cy="220" rx="35" ry="30" fill="#B76E79" opacity="0.15"/>
  <ellipse cx="150" cy="220" rx="35" ry="30" fill="none" stroke="#B76E79" stroke-width="3"/>

  <!-- Left nostril -->
  <ellipse cx="130" cy="230" rx="18" ry="22" fill="none" stroke="#0EA5E9" stroke-width="3"/>
  <ellipse cx="130" cy="235" rx="10" ry="12" fill="#0EA5E9" opacity="0.2"/>

  <!-- Right nostril -->
  <ellipse cx="170" cy="230" rx="18" ry="22" fill="none" stroke="#0EA5E9" stroke-width="3"/>
  <ellipse cx="170" cy="235" rx="10" ry="12" fill="#0EA5E9" opacity="0.2"/>

  <!-- Septum (columella) -->
  <rect x="145" y="240" width="10" height="25" rx="3" fill="#6B7280" opacity="0.2"/>
  <rect x="145" y="240" width="10" height="25" rx="3" fill="none" stroke="#6B7280" stroke-width="2"/>

  <!-- Nostril rim detail -->
  <path d="M 115 225 Q 125 215 135 220"
        fill="none" stroke="#B76E79" stroke-width="2" stroke-linecap="round"/>
  <path d="M 185 225 Q 175 215 165 220"
        fill="none" stroke="#B76E79" stroke-width="2" stroke-linecap="round"/>

  <!-- Nose wings (alae) -->
  <path d="M 110 235 Q 105 245 110 255 Q 120 260 128 253"
        fill="none" stroke="#6B7280" stroke-width="2.5"/>
  <path d="M 190 235 Q 195 245 190 255 Q 180 260 172 253"
        fill="none" stroke="#6B7280" stroke-width="2.5"/>

  <!-- Piercing location markers -->
  <circle cx="125" cy="225" r="4" fill="#0EA5E9"/>  <!-- Left nostril -->
  <circle cx="175" cy="225" r="4" fill="#0EA5E9"/>  <!-- Right nostril -->
  <circle cx="150" cy="255" r="4" fill="#B76E79"/>  <!-- Septum -->

  <!-- Decorative piercing jewelry examples -->
  <g transform="translate(120, 220)">
    <!-- Nose stud gem -->
    <circle r="6" fill="#B76E79" opacity="0.7"/>
    <circle r="3" fill="#0EA5E9"/>
  </g>

  <g transform="translate(170, 220)">
    <!-- Nose ring -->
    <circle r="12" fill="none" stroke="#6B7280" stroke-width="2" opacity="0.5"/>
  </g>

  <!-- Septum ring example -->
  <path d="M 140 255 Q 150 265 160 255"
        fill="none" stroke="#B76E79" stroke-width="2.5" opacity="0.4"/>

  <!-- Profile side view guide (faint) -->
  <path d="M 95 90 Q 85 150 95 200 Q 110 235 140 245"
        fill="none" stroke="#E5E7EB" stroke-width="2" stroke-dasharray="3,3"/>

  <!-- Labels -->
  <text x="150" y="25" font-family="Arial, sans-serif" font-size="18" font-weight="bold" fill="#1F2937" text-anchor="middle">NOSE ANATOMY</text>
  <text x="80" y="230" font-family="Arial, sans-serif" font-size="11" fill="#0EA5E9">Nostril</text>
  <text x="150" y="280" font-family="Arial, sans-serif" font-size="11" fill="#B76E79" text-anchor="middle">Septum</text>
  <text x="150" y="215" font-family="Arial, sans-serif" font-size="11" fill="#6B7280" text-anchor="middle">Tip</text>
  <text x="60" y="250" font-family="Arial, sans-serif" font-size="10" fill="#6B7280">Ala</text>

  <!-- Measurement guides -->
  <line x1="150" y1="300" x2="150" y2="320" stroke="#B76E79" stroke-width="1" opacity="0.3"/>
  <text x="150" y="335" font-family="Arial, sans-serif" font-size="10" fill="#6B7280" text-anchor="middle">Common: 18g-20g</text>
  <text x="150" y="350" font-family="Arial, sans-serif" font-size="10" fill="#6B7280" text-anchor="middle">Septum: 14g-16g</text>
</svg>
