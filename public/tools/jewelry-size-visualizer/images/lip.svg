<svg width="300" height="400" viewBox="0 0 300 400" xmlns="http://www.w3.org/2000/svg">
  <!-- White background -->
  <rect width="300" height="400" fill="white"/>

  <!-- Upper lip (rose gold) -->
  <path d="M 80 160 Q 120 140 150 145 Q 180 140 220 160 L 210 175 Q 180 165 150 170 Q 120 165 90 175 Z"
        fill="#B76E79" opacity="0.3" stroke="#B76E79" stroke-width="3"/>

  <!-- Cupid's bow detail -->
  <path d="M 130 155 Q 140 148 150 145 Q 160 148 170 155"
        fill="none" stroke="#B76E79" stroke-width="2.5"/>

  <!-- Philtrum (area above lip) -->
  <line x1="150" y1="120" x2="150" y2="145" stroke="#6B7280" stroke-width="2" opacity="0.4"/>
  <path d="M 145 125 Q 150 120 155 125"
        fill="none" stroke="#6B7280" stroke-width="1.5"/>

  <!-- Lower lip (gem blue) -->
  <ellipse cx="150" cy="200" rx="65" ry="28" fill="#0EA5E9" opacity="0.2" stroke="#0EA5E9" stroke-width="3"/>

  <!-- Lip line -->
  <line x1="85" y1="175" x2="215" y2="175" stroke="#6B7280" stroke-width="2"/>

  <!-- Monroe/Madonna position (left) -->
  <circle cx="110" cy="150" r="5" fill="#B76E79" opacity="0.5"/>
  <circle cx="110" cy="150" r="5" fill="none" stroke="#B76E79" stroke-width="2"/>

  <!-- Medusa position (center above) -->
  <circle cx="150" cy="135" r="5" fill="#0EA5E9" opacity="0.5"/>
  <circle cx="150" cy="135" r="5" fill="none" stroke="#0EA5E9" stroke-width="2"/>

  <!-- Labret position (center below) -->
  <circle cx="150" cy="235" r="5" fill="#6B7280"/>

  <!-- Snake bites (both sides below) -->
  <circle cx="115" cy="225" r="4" fill="#B76E79"/>
  <circle cx="185" cy="225" r="4" fill="#B76E79"/>

  <!-- Vertical labret guide -->
  <line x1="150" y1="165" x2="150" y2="210" stroke="#0EA5E9" stroke-width="1.5" stroke-dasharray="4,4" opacity="0.3"/>

  <!-- Chin contour -->
  <path d="M 100 235 Q 150 270 200 235"
        fill="none" stroke="#E5E7EB" stroke-width="2"/>

  <!-- Jewelry examples -->
  <g transform="translate(110, 150)">
    <!-- Monroe stud -->
    <circle r="4" fill="#B76E79"/>
    <circle r="2" fill="white" opacity="0.6"/>
  </g>

  <g transform="translate(150, 225)">
    <!-- Labret stud with flat back -->
    <rect x="-3" y="-8" width="6" height="16" rx="1" fill="#6B7280" opacity="0.6"/>
    <circle cy="-8" r="5" fill="#0EA5E9" opacity="0.7"/>
  </g>

  <!-- Ring example (snake bite) -->
  <circle cx="115" cy="225" r="10" fill="none" stroke="#B76E79" stroke-width="2" opacity="0.4"/>

  <!-- Labels -->
  <text x="150" y="25" font-family="Arial, sans-serif" font-size="18" font-weight="bold" fill="#1F2937" text-anchor="middle">LIP ANATOMY</text>
  <text x="150" y="50" font-family="Arial, sans-serif" font-size="12" fill="#6B7280" text-anchor="middle">Common Piercing Locations</text>

  <text x="80" y="145" font-family="Arial, sans-serif" font-size="10" fill="#B76E79">Monroe</text>
  <text x="170" y="130" font-family="Arial, sans-serif" font-size="10" fill="#0EA5E9">Medusa</text>
  <text x="160" y="240" font-family="Arial, sans-serif" font-size="10" fill="#6B7280">Labret</text>
  <text x="95" y="215" font-family="Arial, sans-serif" font-size="10" fill="#B76E79">Snake</text>
  <text x="95" y="225" font-family="Arial, sans-serif" font-size="10" fill="#B76E79">Bites</text>

  <!-- Info box -->
  <rect x="50" y="290" width="200" height="80" rx="8" fill="#F3F4F6" stroke="#6B7280" stroke-width="1"/>
  <text x="150" y="310" font-family="Arial, sans-serif" font-size="11" font-weight="bold" fill="#1F2937" text-anchor="middle">Standard Sizes</text>
  <text x="150" y="330" font-family="Arial, sans-serif" font-size="10" fill="#6B7280" text-anchor="middle">Gauge: 16g - 14g</text>
  <text x="150" y="345" font-family="Arial, sans-serif" font-size="10" fill="#6B7280" text-anchor="middle">Length: 5/16" - 1/2"</text>
  <text x="150" y="360" font-family="Arial, sans-serif" font-size="10" fill="#6B7280" text-anchor="middle">(8-12mm)</text>
</svg>
