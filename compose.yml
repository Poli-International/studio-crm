# docker compose up -d   then open http://localhost:3000
services:
  studio-crm:
    build: .
    ports:
      - "3000:3000"
      - "3443:3443" # https, for tablets and phones (camera)
    volumes:
      - studio-crm-data:/app/data
      - studio-crm-storage:/app/storage # scans and backups
    restart: unless-stopped
volumes:
  studio-crm-data:
  studio-crm-storage:
