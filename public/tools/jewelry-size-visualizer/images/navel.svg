<svg width="300" height="400" viewBox="0 0 300 400" xmlns="http://www.w3.org/2000/svg">
  <!-- White background -->
  <rect width="300" height="400" fill="white"/>

  <!-- Torso outline (subtle) -->
  <path d="M 100 50 Q 80 150 90 250 Q 100 350 120 390"
        fill="none" stroke="#E5E7EB" stroke-width="2"/>
  <path d="M 200 50 Q 220 150 210 250 Q 200 350 180 390"
        fill="none" stroke="#E5E7EB" stroke-width="2"/>

  <!-- Navel cavity (gem blue) -->
  <ellipse cx="150" cy="180" rx="40" ry="50" fill="#0EA5E9" opacity="0.15" stroke="#0EA5E9" stroke-width="3"/>

  <!-- Navel hood/rim (rose gold) -->
  <path d="M 110 165 Q 150 155 190 165 Q 180 175 150 180 Q 120 175 110 165 Z"
        fill="#B76E79" opacity="0.25" stroke="#B76E79" stroke-width="3"/>

  <!-- Navel depth shading -->
  <ellipse cx="150" cy="195" rx="25" ry="30" fill="#6B7280" opacity="0.2"/>

  <!-- Standard top piercing (most common) -->
  <line x1="150" y1="145" x2="150" y2="170" stroke="#B76E79" stroke-width="4"/>
  <circle cx="150" cy="145" r="8" fill="#0EA5E9" opacity="0.7"/>
  <circle cx="150" cy="145" r="4" fill="white"/>
  <circle cx="150" cy="170" r="6" fill="#B76E79" opacity="0.7"/>

  <!-- Decorative gem on top ball -->
  <circle cx="150" cy="145" r="10" fill="none" stroke="#0EA5E9" stroke-width="1" opacity="0.3"/>

  <!-- Bottom piercing (less common) -->
  <circle cx="150" cy="210" r="4" fill="#6B7280" opacity="0.5"/>
  <line x1="150" y1="210" x2="150" y2="225" stroke="#6B7280" stroke-width="2" stroke-dasharray="4,4" opacity="0.4"/>

  <!-- Side piercings -->
  <circle cx="120" cy="185" r="3" fill="#0EA5E9" opacity="0.4"/>
  <circle cx="180" cy="185" r="3" fill="#0EA5E9" opacity="0.4"/>

  <!-- Floating navel example (for shallow navels) -->
  <g opacity="0.3">
    <path d="M 195 165 Q 205 170 205 180"
          fill="none" stroke="#B76E79" stroke-width="2" stroke-dasharray="3,3"/>
    <text x="220" y="175" font-family="Arial, sans-serif" font-size="8" fill="#B76E79">Floating</text>
  </g>

  <!-- Anatomy markers -->
  <circle cx="150" cy="165" r="3" fill="#0EA5E9"/>
  <text x="165" y="140" font-family="Arial, sans-serif" font-size="10" fill="#0EA5E9">Top Gem</text>
  <text x="165" y="175" font-family="Arial, sans-serif" font-size="10" fill="#B76E79">Bottom Ball</text>

  <!-- Curved barbell visualization -->
  <g transform="translate(230, 100)">
    <text y="0" font-family="Arial, sans-serif" font-size="10" fill="#6B7280">Curved</text>
    <text y="12" font-family="Arial, sans-serif" font-size="10" fill="#6B7280">Barbell:</text>
    <path d="M 5 25 Q 10 35 5 45"
          fill="none" stroke="#B76E79" stroke-width="3"/>
    <circle cx="5" cy="25" r="5" fill="#0EA5E9"/>
    <circle cx="5" cy="45" r="4" fill="#6B7280"/>
  </g>

  <!-- Labels -->
  <text x="150" y="25" font-family="Arial, sans-serif" font-size="18" font-weight="bold" fill="#1F2937" text-anchor="middle">NAVEL ANATOMY</text>
  <text x="150" y="45" font-family="Arial, sans-serif" font-size="11" fill="#6B7280" text-anchor="middle">(Belly Button)</text>

  <!-- Info box -->
  <rect x="30" y="260" width="240" height="120" rx="8" fill="#F3F4F6" stroke="#6B7280" stroke-width="1"/>
  <text x="150" y="280" font-family="Arial, sans-serif" font-size="11" font-weight="bold" fill="#1F2937" text-anchor="middle">Standard Curved Barbell</text>
  <text x="150" y="298" font-family="Arial, sans-serif" font-size="10" fill="#6B7280" text-anchor="middle">Gauge: 14g (standard)</text>
  <text x="150" y="313" font-family="Arial, sans-serif" font-size="10" fill="#6B7280" text-anchor="middle">Length: 7/16" - 1/2" (11-12mm)</text>
  <text x="150" y="328" font-family="Arial, sans-serif" font-size="10" fill="#6B7280" text-anchor="middle">Deep navel: 5/8" (16mm)</text>

  <line x1="50" y1="340" x2="250" y2="340" stroke="#D1D5DB" stroke-width="1"/>

  <text x="150" y="357" font-family="Arial, sans-serif" font-size="9" fill="#F59E0B" text-anchor="middle">⚠ Anatomy-dependent piercing</text>
  <text x="150" y="372" font-family="Arial, sans-serif" font-size="9" fill="#9CA3AF" text-anchor="middle">Not everyone can be pierced safely</text>
</svg>
