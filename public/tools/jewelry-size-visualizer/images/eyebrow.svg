<svg width="300" height="400" viewBox="0 0 300 400" xmlns="http://www.w3.org/2000/svg">
  <!-- White background -->
  <rect width="300" height="400" fill="white"/>

  <!-- Eyebrow hair texture (rose gold) -->
  <path d="M 70 150 Q 100 140 130 145 Q 160 150 190 148 Q 220 145 240 150"
        fill="none" stroke="#B76E79" stroke-width="8" stroke-linecap="round" opacity="0.3"/>
  <path d="M 75 155 Q 105 145 135 150 Q 165 155 195 153 Q 220 151 235 155"
        fill="none" stroke="#B76E79" stroke-width="6" stroke-linecap="round" opacity="0.4"/>
  <path d="M 80 148 Q 110 138 140 143 Q 170 148 200 146 Q 225 144 238 148"
        fill="none" stroke="#B76E79" stroke-width="7" stroke-linecap="round" opacity="0.35"/>

  <!-- Individual hairs detail -->
  <g stroke="#6B7280" stroke-width="1" opacity="0.3">
    <line x1="85" y1="145" x2="80" y2="140"/>
    <line x1="95" y1="142" x2="92" y2="136"/>
    <line x1="110" y1="140" x2="108" y2="133"/>
    <line x1="125" y1="143" x2="124" y2="137"/>
    <line x1="145" y1="147" x2="145" y2="140"/>
    <line x1="165" y1="149" x2="166" y2="142"/>
    <line x1="185" y1="148" x2="187" y2="141"/>
    <line x1="205" y1="146" x2="208" y2="139"/>
    <line x1="220" y1="146" x2="224" y2="140"/>
  </g>

  <!-- Eye outline below (gem blue) -->
  <ellipse cx="155" cy="210" rx="60" ry="30" fill="white" stroke="#0EA5E9" stroke-width="3"/>

  <!-- Iris -->
  <circle cx="155" cy="210" r="20" fill="#0EA5E9" opacity="0.3"/>
  <circle cx="155" cy="210" r="15" fill="#0EA5E9" opacity="0.5"/>
  <circle cx="155" cy="210" r="8" fill="#1F2937"/>

  <!-- Pupil highlight -->
  <circle cx="150" cy="205" r="3" fill="white" opacity="0.8"/>

  <!-- Vertical piercing (most common) -->
  <line x1="140" y1="130" x2="140" y2="175" stroke="#6B7280" stroke-width="3" opacity="0.6"/>
  <circle cx="140" cy="130" r="6" fill="#B76E79" opacity="0.7"/>
  <circle cx="140" cy="175" r="6" fill="#B76E79" opacity="0.7"/>
  <circle cx="140" cy="152" r="5" fill="#0EA5E9"/>

  <!-- Horizontal piercing option -->
  <line x1="120" y1="145" x2="165" y2="145" stroke="#0EA5E9" stroke-width="2" stroke-dasharray="5,5" opacity="0.4"/>
  <circle cx="120" cy="145" r="4" fill="#0EA5E9" opacity="0.5"/>
  <circle cx="165" cy="145" r="4" fill="#0EA5E9" opacity="0.5"/>

  <!-- Anti-eyebrow location (below eye) -->
  <circle cx="180" cy="245" r="4" fill="#6B7280" opacity="0.5"/>
  <line x1="180" y1="230" x2="180" y2="260" stroke="#6B7280" stroke-width="2" stroke-dasharray="3,3" opacity="0.3"/>

  <!-- Face contour -->
  <path d="M 50 120 Q 100 80 200 80 Q 250 90 270 130"
        fill="none" stroke="#E5E7EB" stroke-width="2" opacity="0.5"/>

  <!-- Bone structure guide -->
  <path d="M 90 150 L 220 150"
        fill="none" stroke="#E5E7EB" stroke-width="1" stroke-dasharray="4,4" opacity="0.3"/>

  <!-- Labels -->
  <text x="150" y="25" font-family="Arial, sans-serif" font-size="18" font-weight="bold" fill="#1F2937" text-anchor="middle">EYEBROW ANATOMY</text>

  <text x="110" y="130" font-family="Arial, sans-serif" font-size="10" fill="#B76E79">Top Ball</text>
  <text x="110" y="178" font-family="Arial, sans-serif" font-size="10" fill="#B76E79">Bottom Ball</text>
  <text x="105" y="152" font-family="Arial, sans-serif" font-size="10" fill="#0EA5E9">Vertical</text>
  <text x="165" y="135" font-family="Arial, sans-serif" font-size="9" fill="#0EA5E9" opacity="0.7">Horizontal</text>
  <text x="195" y="245" font-family="Arial, sans-serif" font-size="9" fill="#6B7280">Anti-Brow</text>

  <!-- Warning indicator -->
  <g transform="translate(50, 290)">
    <circle r="15" fill="#FEF3C7" stroke="#F59E0B" stroke-width="2"/>
    <text y="5" font-family="Arial, sans-serif" font-size="18" fill="#F59E0B" text-anchor="middle">!</text>
  </g>

  <!-- Info box -->
  <rect x="35" y="280" width="230" height="100" rx="8" fill="#F3F4F6" stroke="#6B7280" stroke-width="1"/>
  <text x="150" y="305" font-family="Arial, sans-serif" font-size="11" font-weight="bold" fill="#1F2937" text-anchor="middle">Curved Barbell Standard</text>
  <text x="150" y="323" font-family="Arial, sans-serif" font-size="10" fill="#6B7280" text-anchor="middle">Gauge: 16g (most common)</text>
  <text x="150" y="338" font-family="Arial, sans-serif" font-size="10" fill="#6B7280" text-anchor="middle">Length: 3/8" - 1/2" (10-12mm)</text>
  <text x="150" y="358" font-family="Arial, sans-serif" font-size="9" fill="#F59E0B" text-anchor="middle">⚠ High rejection/migration risk</text>
  <text x="150" y="372" font-family="Arial, sans-serif" font-size="9" fill="#9CA3AF" text-anchor="middle">Proper angle critical for healing</text>
</svg>
