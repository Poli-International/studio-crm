<svg width="300" height="400" viewBox="0 0 300 400" xmlns="http://www.w3.org/2000/svg">
  <!-- White background -->
  <rect width="300" height="400" fill="white"/>

  <!-- Playful banana representation -->

  <!-- Banana body (rose gold gradient) -->
  <defs>
    <linearGradient id="bananaGradient" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#F9DC5C;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#F4D03F;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#E8B923;stop-opacity:1" />
    </linearGradient>
    <radialGradient id="eggGradient">
      <stop offset="0%" style="stop-color:#FFFEF7;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#F5F0E1;stop-opacity:1" />
    </radialGradient>
  </defs>

  <!-- Banana -->
  <path d="M 150 80 Q 140 100 145 150 Q 150 200 145 250 Q 140 280 150 300 Q 160 280 155 250 Q 150 200 155 150 Q 160 100 150 80 Z"
        fill="url(#bananaGradient)" stroke="#E8B923" stroke-width="3"/>

  <!-- Banana ridge details -->
  <path d="M 145 100 Q 145 150 145 250"
        fill="none" stroke="#D4A017" stroke-width="2" opacity="0.4"/>
  <path d="M 155 100 Q 155 150 155 250"
        fill="none" stroke="#D4A017" stroke-width="2" opacity="0.4"/>

  <!-- Banana spots (ripeness marks) -->
  <ellipse cx="135" cy="150" rx="8" ry="6" fill="#8B4513" opacity="0.3"/>
  <ellipse cx="165" cy="180" rx="6" ry="5" fill="#8B4513" opacity="0.3"/>
  <ellipse cx="140" cy="220" rx="7" ry="5" fill="#8B4513" opacity="0.3"/>

  <!-- Banana tip (top) -->
  <ellipse cx="150" cy="80" rx="8" ry="6" fill="#8B7355"/>
  <path d="M 147 75 Q 150 70 153 75"
        fill="none" stroke="#6B5638" stroke-width="2" stroke-linecap="round"/>

  <!-- Two eggs at base -->
  <ellipse cx="130" cy="310" rx="25" ry="30" fill="url(#eggGradient)" stroke="#D1C4B0" stroke-width="2"/>
  <ellipse cx="170" cy="310" rx="25" ry="30" fill="url(#eggGradient)" stroke="#D1C4B0" stroke-width="2"/>

  <!-- Egg shading -->
  <ellipse cx="127" cy="305" rx="8" ry="10" fill="white" opacity="0.5"/>
  <ellipse cx="167" cy="305" rx="8" ry="10" fill="white" opacity="0.5"/>

  <!-- Piercing locations marked -->

  <!-- Prince Albert (tip area) -->
  <circle cx="150" cy="290" r="5" fill="#B76E79"/>
  <text x="165" y="293" font-family="Arial, sans-serif" font-size="9" fill="#B76E79">PA</text>

  <!-- Frenum (shaft) -->
  <circle cx="140" cy="200" r="4" fill="#0EA5E9"/>
  <text x="120" y="203" font-family="Arial, sans-serif" font-size="9" fill="#0EA5E9">Frenum</text>

  <!-- Apadravya (vertical through) -->
  <line x1="150" y1="180" x2="150" y2="210" stroke="#6B7280" stroke-width="2" stroke-dasharray="4,4" opacity="0.5"/>
  <circle cx="150" cy="180" r="3" fill="#6B7280"/>
  <circle cx="150" cy="210" r="3" fill="#6B7280"/>
  <text x="160" y="195" font-family="Arial, sans-serif" font-size="8" fill="#6B7280">Apadravya</text>

  <!-- Hafada (egg area) -->
  <circle cx="135" cy="330" r="4" fill="#0EA5E9" opacity="0.7"/>
  <circle cx="165" cy="330" r="4" fill="#0EA5E9" opacity="0.7"/>
  <text x="125" y="355" font-family="Arial, sans-serif" font-size="8" fill="#0EA5E9">Hafada</text>

  <!-- Circular barbell example -->
  <g transform="translate(230, 120)">
    <text y="-5" font-family="Arial, sans-serif" font-size="9" fill="#6B7280">Example</text>
    <text y="5" font-family="Arial, sans-serif" font-size="9" fill="#6B7280">Jewelry:</text>
    <path d="M 0 15 Q 0 30 15 35 Q 30 30 30 15"
          fill="none" stroke="#B76E79" stroke-width="2"/>
    <circle cx="0" cy="15" r="4" fill="#0EA5E9"/>
    <circle cx="30" cy="15" r="4" fill="#0EA5E9"/>
  </g>

  <!-- Labels -->
  <text x="150" y="25" font-family="Arial, sans-serif" font-size="18" font-weight="bold" fill="#1F2937" text-anchor="middle">MALE GENITAL</text>
  <text x="150" y="45" font-family="Arial, sans-serif" font-size="11" fill="#6B7280" text-anchor="middle">Piercing Locations</text>
  <text x="150" y="60" font-family="Arial, sans-serif" font-size="9" fill="#9CA3AF" text-anchor="middle">(Playful representation)</text>

  <!-- Common piercings list -->
  <g transform="translate(30, 120)">
    <text y="0" font-family="Arial, sans-serif" font-size="10" font-weight="bold" fill="#B76E79">Common Types:</text>
    <text y="15" font-family="Arial, sans-serif" font-size="9" fill="#6B7280">• Prince Albert</text>
    <text y="28" font-family="Arial, sans-serif" font-size="9" fill="#6B7280">• Reverse PA</text>
    <text y="41" font-family="Arial, sans-serif" font-size="9" fill="#6B7280">• Frenum</text>
    <text y="54" font-family="Arial, sans-serif" font-size="9" fill="#6B7280">• Apadravya</text>
    <text y="67" font-family="Arial, sans-serif" font-size="9" fill="#6B7280">• Ampallang</text>
    <text y="80" font-family="Arial, sans-serif" font-size="9" fill="#6B7280">• Hafada</text>
    <text y="93" font-family="Arial, sans-serif" font-size="9" fill="#6B7280">• Lorum</text>
  </g>

  <!-- Info box -->
  <rect x="20" y="360" width="260" height="35" rx="8" fill="#F3F4F6" stroke="#6B7280" stroke-width="1"/>
  <text x="150" y="378" font-family="Arial, sans-serif" font-size="10" font-weight="bold" fill="#1F2937" text-anchor="middle">Standard: 10g-14g Circular/Straight Barbells</text>
  <text x="150" y="390" font-family="Arial, sans-serif" font-size="8" fill="#F59E0B" text-anchor="middle">⚠ Professional consultation essential - anatomy varies significantly</text>
</svg>
